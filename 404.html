<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <title>404 — Anton CGI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/home.css">
  <link rel="icon" href="assets/favicon_io/favicon.ico" sizes="48x48">

<body class="not-found">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <canvas id="canvas" aria-hidden="true"></canvas>

  <span class="error-code" aria-hidden="true">404</span>

  <main class="container" id="main-content">
    <header class="header">
      <h1>Lost</h1>
      <p class="lost-message">Page not found</p>
    </header>

    <div class="lost-detail">
      <p>This page drifted into the void. The particles couldn't find it either.</p>
    </div>

    <a href="/" class="back-link">← Return home</a>
  </main>

  <div class="footer">© <span id="year"></span></div>
  <div class="coordinates" id="coords" aria-hidden="true">0.000 / 0.000</div>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  <script src="assets/js/flow-field.js"></script>
</body>
</html>
